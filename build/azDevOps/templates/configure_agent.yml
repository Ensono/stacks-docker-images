parameters:
  - name: EirctlVersion
    type: string
  - name: TerraformVersion
    type: string
  - name: EnsonoBuildVersion
    type: string
  - name: DockerPushRMVersion
    type: string
  - name: YqVersion
    type: string
  - name: PowerShellVersion
    type: string
  - name: BuildNumber
    type: string
  - name: DockerContainerRegistryName
    type: string
  - name: PlatformArch
    type: string
steps:
    - task: Bash@3
      displayName: Install PowerShell
      condition: false
      inputs:
        targetType: inline
        script: |
          if command -v pwsh &> /dev/null; then
            echo "PowerShell is already installed: $(pwsh --version)"
          else

            # Download the powershell .tar.gz archive
            URL="https://github.com/PowerShell/PowerShell/releases/download/v${{ parameters.PowerShellVersion }}/powershell-${{ parameters.PowerShellVersion }}-linux-${{ parameters.PlatformArch }}.tar.gz"
            echo "Downloading PowerShell: $URL"
            curl -o /tmp/powershell.tar.gz -L $URL

            # Make the directory to extract powershell to
            echo "Creating powershell directory: /opt/microsoft/powershell/7"
            sudo mkdir -p /opt/microsoft/powershell/7

            # Extract the archive into the directory
            echo "Extracting powershell"
            sudo tar -xzf /tmp/powershell.tar.gz -C /opt/microsoft/powershell/7

            # Ensure that pwsh is executable
            echo "Making pwsh executable"
            sudo chmod +x /opt/microsoft/powershell/7/pwsh

            # Create symlink so pwsh is in the path
            echo "Creating symlink for pwsh"
            sudo ln -s /opt/microsoft/powershell/7/pwsh /usr/bin/pwsh
          fi



    - task: PowerShell@2
      displayName: Configure Agent
      inputs:
        targetType: inline
        script: |
          $InformationPreference = "Continue"

          $splat = @{
            EirctlVersion = "${{ parameters.EirctlVersion }}"
            TerraformVersion = "${{ parameters.TerraformVersion }}"
            EnsonoBuildVersion = "${{ parameters.EnsonoBuildVersion }}"
            DockerPushRMVersion = "${{ parameters.DockerPushRMVersion }}"
            YqVersion = "${{ parameters.YqVersion }}"
            BuildNumber = "${{ parameters.BuildNumber }}"
            DockerContainerRegistryName = "${{ parameters.DockerContainerRegistryName }}"
          }

          $splat

          . build/scripts/Initialize-Agent.ps1 @splat


